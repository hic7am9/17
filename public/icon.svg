<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Building/Apartment silhouette -->
  <g filter="url(#shadow)">
    <!-- Main building block -->
    <rect x="150" y="150" width="130" height="220" rx="10" fill="url(#building)" opacity="0.95"/>
    <!-- Windows row 1 -->
    <rect x="168" y="175" width="28" height="28" rx="5" fill="#0f172a" opacity="0.6"/>
    <rect x="234" y="175" width="28" height="28" rx="5" fill="#0f172a" opacity="0.6"/>
    <!-- Windows row 2 -->
    <rect x="168" y="225" width="28" height="28" rx="5" fill="#0f172a" opacity="0.6"/>
    <rect x="234" y="225" width="28" height="28" rx="5" fill="#0f172a" opacity="0.6"/>
    <!-- Windows row 3 -->
    <rect x="168" y="275" width="28" height="28" rx="5" fill="#0f172a" opacity="0.6"/>
    <rect x="234" y="275" width="28" height="28" rx="5" fill="#0f172a" opacity="0.6"/>
    <!-- Door -->
    <rect x="195" y="325" width="40" height="45" rx="6" fill="#0f172a" opacity="0.7"/>

    <!-- Second smaller building -->
    <rect x="300" y="200" width="80" height="170" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <rect x="315" y="220" width="20" height="20" rx="4" fill="#38bdf8" opacity="0.4"/>
    <rect x="345" y="220" width="20" height="20" rx="4" fill="#38bdf8" opacity="0.4"/>
    <rect x="315" y="260" width="20" height="20" rx="4" fill="#38bdf8" opacity="0.4"/>
    <rect x="345" y="260" width="20" height="20" rx="4" fill="#38bdf8" opacity="0.4"/>
    <rect x="315" y="300" width="20" height="20" rx="4" fill="#38bdf8" opacity="0.4"/>
    <rect x="345" y="300" width="20" height="20" rx="4" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- Key overlay (property management symbol) -->
  <g filter="url(#shadow)" transform="translate(280, 310)">
    <!-- Key ring -->
    <circle cx="35" cy="35" r="32" fill="none" stroke="url(#key)" stroke-width="9"/>
    <circle cx="35" cy="35" r="14" fill="#0f172a"/>
    <!-- Key shaft -->
    <rect x="62" y="31" width="80" height="8" rx="4" fill="url(#key)"/>
    <!-- Key teeth -->
    <rect x="120" y="39" width="8" height="14" rx="2" fill="url(#key)"/>
    <rect x="134" y="39" width="8" height="20" rx="2" fill="url(#key)"/>
  </g>

  <!-- Ground line -->
  <rect x="120" y="370" width="272" height="6" rx="3" fill="#38bdf8" opacity="0.3"/>
</svg>
